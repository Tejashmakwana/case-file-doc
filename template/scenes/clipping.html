  <script>
    const tl = gsap.timeline({ paused: true });
    const P = "#tpl-page";
    // "Two days later" 0.16 — the date rolls forward like a counter
    tl.fromTo("#tpl-roll", { y: 0 }, { y: -340, duration: 0.6, ease: "power3.inOut" }, 0.2);
    tl.fromTo("#tpl-later div", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "steps(14)" }, 0.25);
    // "<according to the outlet>" 1.33 — page tilts in under the camera
    tl.fromTo(P, { rotationX: 30, rotationZ: -6, scale: 1.0, x: 260, y: 520, opacity: 0 }, { rotationX: 16, rotationZ: -3, scale: 1.05, x: 120, y: 120, opacity: 1, duration: 0.8, ease: "expo.out" }, 1.15);
    tl.to(P, { scale: 1.32, x: 80, y: -20, rotationX: 13, duration: 2.0, ease: "power2.inOut" }, 2.0);
    // "<first highlighted phrase>" 2.8–4.7
    tl.fromTo("#tpl-hlA", { backgroundSize: "0% 62%" }, { backgroundSize: "100% 62%", duration: 1.4, ease: "power1.inOut" }, 2.95);
    tl.to(P, { y: -150, x: 60, duration: 1.6, ease: "power2.inOut" }, 4.1);
    // "<second highlighted phrase>" 5.32–6.14
    tl.fromTo("#tpl-hlB", { backgroundSize: "0% 62%" }, { backgroundSize: "100% 62%", duration: 1.0, ease: "power1.inOut" }, 5.2);
    tl.to("#tpl-under", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 6.05);
    tl.to(["#tpl-date", "#tpl-later"], { opacity: 0, duration: 0.2 }, 1.15);
    // exit: torn away left-to-right
    let seed = 0x3c9d;
    const r = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
    const jag = Array.from({ length: 31 }, () => (r() - 0.5) * 3.2);
    const edge = (X) => {
      const pts = ["100% 0%"];
      for (let i = 0; i <= 30; i++) pts.push((X + jag[i] + Math.sin(i * 1.3) * 1.1).toFixed(2) + "% " + ((i / 30) * 100).toFixed(2) + "%");
      pts.push("100% 100%");
      return "polygon(" + pts.join(", ") + ")";
    };
    tl.fromTo("#root", { clipPath: edge(-12) }, { clipPath: edge(116), duration: 0.3, ease: "power3.in" }, 7.0);
